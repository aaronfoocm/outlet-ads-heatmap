# ── Cloud Build CI/CD for Koppiku Outlet ADS Heatmap ─────────────
# Triggers: push to any branch (edit trigger to limit to main/v1.x)
# Setup in GCP Console:
#   Cloud Build → Triggers → New Trigger
#   Event: Push to branch
#   Branch: ^(main|v[0-9]+\.[0-9]+)$
#   Configuration: cloudbuild.yaml (this file)
#   Build configuration: Cloud Build configuration file (cloudbuild.yaml)
#   Substitutions:
#     _SERVICE_NAME: koppiku-heatmap
#     _REGION: asia-southeast1
#     _REPO: github.com_aaronfoocm_outlet-ads-heatmap

steps:
  # ── Step 1: Build Docker image ────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'
      - '-f'
      - 'app/Dockerfile'
      - 'app/'

  # ── Step 2: Push image to Container Registry ───────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '-a'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME'

  # ── Step 3: Deploy to Cloud Run ────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--set-env-vars=NODE_ENV=production'

# ── Images pushed to Container Registry ────────────────────────────
images:
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'

# ── Build options ─────────────────────────────────────────────────
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  dynamicSubstitutions: true

# ── Substitution variables (override in trigger) ──────────────────
substitutions:
  _SERVICE_NAME: koppiku-heatmap
  _REGION: asia-southeast1
  _REPO: outlet-ads-heatmap
